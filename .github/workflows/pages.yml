name: Publish to GitHub Pages

# GitHub Pages serves this repo from the gh-pages branch, so every push to the
# source branch is mirrored there. No build step: the app is plain HTML, CSS and JS.

on:
  push:
    branches: ["claude/house-move-checklist-rnl985", "main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror this commit to gh-pages
        run: git push --force origin "HEAD:refs/heads/gh-pages"
